<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostMap - Frequency Radar & Signal Tracker</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00f0ff">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-cyan: #00f0ff;
            --accent-orange: #ff5500;
            --text-main: #e0e6ed;
            --text-muted: #7a8b9e;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 12px 20px;
            background: #0d1322;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-summary {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            padding: 10px 20px;
            background: #101726;
            overflow-x: auto;
        }

        .filter-btn {
            background: #1a233a;
            border: 1px solid #2d3b59;
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .filter-btn.active {
            background: #00f0ff22;
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .main-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 15px;
            box-sizing: border-box;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
        }

        .radar-panel {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid #1e2b45;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 10px;
        }

        canvas#radarCanvas {
            max-width: 100%;
            max-height: 100%;
        }

        .feed-panel {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid #1e2b45;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .feed-header {
            padding: 12px 16px;
            background: #182238;
            font-size: 0.9rem;
            font-weight: 600;
            border-bottom: 1px solid #253352;
            display: flex;
            justify-content: space-between;
        }

        .signal-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .signal-card {
            background: #162034;
            border: 1px solid #223254;
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .signal-card.wifi { border-left: 4px solid var(--accent-cyan); }
        .signal-card.bluetooth { border-left: 4px solid #b026ff; }

        .signal-info .name {
            font-weight: 600;
            font-size: 0.9rem;
            color: #ffffff;
        }

        .signal-info .sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .signal-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: #202d4a;
            color: var(--text-muted);
        }

        .controls-footer {
            padding: 12px 20px;
            background: #0d1322;
            border-top: 1px solid #1e293b;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .scan-btn {
            background: var(--accent-orange);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 24px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 85, 0, 0.4);
            transition: all 0.2s ease;
        }

        .install-btn {
            background: #00f0ff;
            color: #0d1322;
            border: none;
            padding: 12px 28px;
            border-radius: 24px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-title">
        <span>📡 GhostMap</span>
    </div>
    <div class="stats-summary" id="statsSummary">
        50 nearby • 26 Wi-Fi • 24 Bluetooth
    </div>
</header>

<div class="filter-bar">
    <button class="filter-btn active">All</button>
    <button class="filter-btn">Wi-Fi</button>
    <button class="filter-btn">Bluetooth</button>
    <button class="filter-btn">Flock / Camera</button>
    <button class="filter-btn">Saved</button>
</div>

<div class="main-container">
    <div class="radar-panel">
        <canvas id="radarCanvas" width="400" height="400"></canvas>
    </div>

    <div class="feed-panel">
        <div class="feed-header">
            <span>Live Scan Panel</span>
            <span style="color: #00f0ff;">Active</span>
        </div>
        <div class="signal-list" id="signalList"></div>
    </div>
</div>

<div class="controls-footer">
    <button class="scan-btn" id="scanBtn" onclick="toggleScan()">|| Stop scan</button>
    <button class="install-btn" id="installBtn">📲 Add to Home Screen</button>
</div>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const installBtn = document.getElementById('installBtn');
        installBtn.style.display = 'inline-block';
        installBtn.addEventListener('click', () => {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(() => {
                deferredPrompt = null;
                installBtn.style.display = 'none';
            });
        });
    });

    const canvas = document.getElementById('radarCanvas');
    const ctx = canvas.getContext('2d');
    let scanning = true;
    let angle = 0;

    const mockSignals = [
        { name: "Bill Luke Since 1927", type: "wifi", sub: "TP-Link Systems Inc. • WPA3", rssi: -45, angle: 45, dist: 0.6 },
        { name: "TP-Link_5G_Ext", type: "wifi", sub: "Encrypted WPA2", rssi: -62, angle: 120, dist: 0.4 },
        { name: "unnamed LE", type: "bluetooth", sub: "BLE Device • Unknown Maker", rssi: -80, angle: 210, dist: 0.8 },
        { name: "Flock_ALPR_Cam_04", type: "wifi", sub: "Flock Safety System", rssi: -55, angle: 310, dist: 0.3 },
        { name: "Axon_Body_3_#8812", type: "bluetooth", sub: "Axon Signal Beacon", rssi: -72, angle: 170, dist: 0.5 }
    ];

    function renderFeed() {
        const list = document.getElementById('signalList');
        list.innerHTML = mockSignals.map(sig => `
            <div class="signal-card ${sig.type}">
                <div class="signal-info">
                    <div class="name">${sig.name}</div>
                    <div class="sub">${sig.sub}</div>
                </div>
                <div class="signal-badge">${sig.rssi} dBm</div>
            </div>
        `).join('');
    }

    function drawRadar() {
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const r = canvas.width / 2 - 20;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#1e2e4a';
        ctx.lineWidth = 1.5;
        for (let i = 1; i <= 3; i++) {
            ctx.beginPath();
            ctx.arc(cx, cy, (r / 3) * i, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.beginPath();
        ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy);
        ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r);
        ctx.stroke();

        mockSignals.forEach(sig => {
            const rad = (sig.angle * Math.PI) / 180;
            const sx = cx + Math.cos(rad) * (r * sig.dist);
            const sy = cy + Math.sin(rad) * (r * sig.dist);

            ctx.beginPath();
            ctx.arc(sx, sy, 5, 0, Math.PI * 2);
            ctx.fillStyle = sig.type === 'wifi' ? '#00f0ff' : '#b026ff';
            ctx.shadowBlur = 8;
            ctx.shadowColor = ctx.fillStyle;
            ctx.fill();
            ctx.shadowBlur = 0;
        });

        if (scanning) {
            angle = (angle + 0.03) % (Math.PI * 2);
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, angle - 0.2, angle);
            ctx.lineTo(cx, cy);
            const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
            grad.addColorStop(0, 'rgba(0, 240, 255, 0.1)');
            grad.addColorStop(1, 'rgba(0, 240, 255, 0.3)');
            ctx.fillStyle = grad;
            ctx.fill();
        }

        requestAnimationFrame(drawRadar);
    }

    function toggleScan() {
        scanning = !scanning;
        const btn = document.getElementById('scanBtn');
        if (scanning) {
            btn.textContent = "|| Stop scan";
            btn.classList.remove('scanning');
        } else {
            btn.textContent = "▶ Start scan";
            btn.classList.add('scanning');
        }
    }

    renderFeed();
    drawRadar();
</script>

</body>
</html>
