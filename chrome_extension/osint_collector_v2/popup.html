<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OSINT Neo AI — Evidence Collector</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.95);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --accent-green: #22c55e;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    header {
      padding: 12px 16px;
      background: rgba(10, 15, 26, 0.9);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      font-weight: 700;
      font-size: 14px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      background: rgba(34, 197, 94, 0.15);
      color: var(--accent-green);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
    }
    .nav-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 20, 30, 0.8);
    }
    .tab-btn {
      flex: 1;
      padding: 8px 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom: 2px solid var(--accent);
      background: rgba(56, 189, 248, 0.08);
    }
    .content-pane {
      padding: 14px 16px;
      display: none;
    }
    .content-pane.active {
      display: block;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select, textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .meta-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
      margin-bottom: 12px;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .meta-row:last-child { margin-bottom: 0; }
    .meta-label { color: var(--text-muted); }
    .meta-val { font-family: monospace; color: var(--accent); word-break: break-all; }
    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #000;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      margin-top: 6px;
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }
    #status-msg {
      margin-top: 10px;
      font-size: 11px;
      padding: 6px;
      border-radius: 4px;
      text-align: center;
      display: none;
    }
    .status-ok { background: rgba(34, 197, 94, 0.15); color: var(--accent-green); display: block !important; }
    .status-err { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); display: block !important; }
    .receipt-item {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 8px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>⚡ OSINT Neo AI</span>
    </div>
    <div class="badge" id="hud-status">ONLINE</div>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" data-tab="tab-capture">1-Click Capture</button>
    <button class="tab-btn" data-tab="tab-dump">Batch Tabs</button>
    <button class="tab-btn" data-tab="tab-vault">Receipts Vault</button>
  </div>

  <div id="tab-capture" class="content-pane active">
    <div class="meta-box">
      <div class="meta-row">
        <span class="meta-label">Title:</span>
        <span class="meta-val" id="page-title">Loading...</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">URL:</span>
        <span class="meta-val" id="page-url">...</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">SHA-256:</span>
        <span class="meta-val" id="page-hash">Computing...</span>
      </div>
    </div>

    <div class="form-group">
      <label>Target Category</label>
      <select id="evidence-category">
        <option value="MUNICIPAL_CORRUPTION">Huntington Beach / Municipal</option>
        <option value="ENVIRONMENTAL_DTSC">DTSC / GeoTracker Toxic Plume</option>
        <option value="EVICTION_UNLAWFUL_DETAINER">Eviction / Woodbridge Meadows</option>
        <option value="CORPORATE_SHELL">NWORICO / Corporate Shell</option>
        <option value="GENERAL_OSINT" selected>General OSINT Evidence</option>
      </select>
    </div>

    <div class="form-group">
      <label>Evidence Notes / Selection</label>
      <textarea id="evidence-selection" rows="3" placeholder="Selected text or forensic observations..."></textarea>
    </div>

    <button id="btn-submit-evidence" class="btn">🚀 Ingest Evidence to Ledger</button>
    <button id="btn-copy-markdown" class="btn btn-secondary">📋 Copy as Markdown</button>
    <div id="status-msg"></div>
  </div>

  <div id="tab-dump" class="content-pane">
    <p style="font-size:11px; color:var(--text-muted); margin-bottom:10px;">Export all tabs across current window for batch OSINT ingestion.</p>
    <button id="btn-dump-json" class="btn">📦 Export Window as JSON</button>
    <button id="btn-dump-markdown" class="btn btn-secondary">📋 Export Window as Markdown</button>
    <div id="dump-count" style="margin-top:10px; font-size:11px; color:var(--text-muted); text-align:center;"></div>
  </div>

  <div id="tab-vault" class="content-pane">
    <div id="receipts-list">
      <div style="text-align:center; color:var(--text-muted); font-size:11px; padding:12px;">No receipts yet. Ingest evidence to generate cryptographic proofs.</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
