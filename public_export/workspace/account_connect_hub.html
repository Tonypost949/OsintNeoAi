<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OsintNeoAi - One-Click Account Connection Hub</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f19; color: #e2e8f0; padding: 24px; }
    h1 { color: #38bdf8; font-size: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; text-align: center; }
    .status { font-size: 12px; margin-top: 8px; padding: 4px 8px; border-radius: 4px; display: inline-block; }
    .connected { background: #065f46; color: #34d399; }
    .disconnected { background: #7f1d1d; color: #f87171; }
    button { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 12px; }
    button:hover { background: #0369a1; }
  </style>
</head>
<body>
  <h1>🔑 Connect Your Free Developer Accounts</h1>
  <p style="color: #94a3b8; font-size: 14px;">Log in once with your standard free accounts. No API keys or manual configuration needed!</p>

  <div class="grid">
    <!-- Google Account Card -->
    <div class="card">
      <h3>Google AI & Drive</h3>
      <span class="status connected">✓ Connected (3 Accounts)</span>
      <button onclick="alert('Google SSO active!')">Manage Google SSO</button>
    </div>

    <!-- Microsoft / Azure Card -->
    <div class="card">
      <h3>Microsoft & OneDrive</h3>
      <span class="status connected">✓ Connected</span>
      <button onclick="alert('Microsoft SSO active!')">Manage Microsoft SSO</button>
    </div>

    <!-- GitHub Card -->
    <div class="card">
      <h3>GitHub & Codespaces</h3>
      <span class="status connected">✓ Connected</span>
      <button onclick="alert('GitHub SSO active!')">Manage GitHub SSO</button>
    </div>

    <!-- OpenCode CLI Card -->
    <div class="card">
      <h3>OpenCode Free Engine</h3>
      <span class="status connected">✓ Connected (v1.3.14)</span>
      <button onclick="alert('OpenCode CLI Active!')">Manage OpenCode</button>
    </div>
  </div>
</body>
</html>
