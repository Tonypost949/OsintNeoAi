<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OsintNeoAI - Local OSINT Dashboard</title>
<style>
:root{--bg:#0a0c10;--surface:#11151c;--accent:#00e5ff;--accent2:#39ff14;--text:#e8eaed;--text2:#8892a0;--border:#1e2530;--danger:#ff2a5f}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
.header{background:linear-gradient(135deg,#0a0c10,#1a1f2e);border-bottom:1px solid var(--border);padding:20px;text-align:center}
.header h1{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:28px}
.header p{color:var(--text2);margin-top:5px}
.container{max-width:1400px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:20px;margin-top:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px}
.card h2{color:var(--accent);margin-bottom:15px;font-size:18px}
.card h3{color:var(--accent2);margin:10px 0 5px;font-size:14px}
input[type="text"],input[type="number"]{width:100%;padding:10px;background:#0a0c10;border:1px solid var(--border);border-radius:6px;color:var(--text);margin:5px 0;font-size:14px}
button{background:var(--accent);color:#000;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:600;margin:5px}
button:hover{background:#22d3ee}
button.danger{background:var(--danger)}
.output{background:#0a0c10;border:1px solid var(--border);border-radius:6px;padding:10px;margin-top:10px;font-family:monospace;font-size:12px;max-height:400px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.tag{display:inline-block;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.2);padding:2px 8px;border-radius:4px;margin:2px;font-size:11px}
.status{color:var(--accent2)}
.error{color:var(--danger)}
.grid-item{grid-column:span 1}
</style>
</head>
<body>
<div class="header">
<h1>OsintNeoAI - Local OSINT Dashboard</h1>
<p>All tools running locally on your PC - No cloud required</p>
</div>
<div class="container">
<div class="grid">

<!-- DNS/WHOIS -->
<div class="card">
<h2>Domain Recon</h2>
<input type="text" id="domain" placeholder="Enter domain (e.g. example.com)">
<button onclick="dnsLookup()">DNS Lookup</button>
<button onclick="whoisLookup()">WHOIS</button>
<button onclick="fullRecon()">Full Recon</button>
<button onclick="certCheck()">SSL Cert</button>
<div id="domainOutput" class="output">Results will appear here...</div>
</div>

<!-- Port Scan -->
<div class="card">
<h2>Port Scanner</h2>
<input type="text" id="host" placeholder="Enter IP or hostname">
<button onclick="portScan()">Scan Ports</button>
<div id="portOutput" class="output">Results will appear here...</div>
</div>

<!-- IP Info -->
<div class="card">
<h2>IP Intelligence</h2>
<input type="text" id="ip" placeholder="Enter IP address">
<button onclick="ipLookup()">IP Info</button>
<button onclick="shodanLookup()">Shodan</button>
<div id="ipOutput" class="output">Results will appear here...</div>
</div>

<!-- WiFi -->
<div class="card">
<h2>WiFi Scanner</h2>
<button onclick="wifiScan()">Scan WiFi Networks</button>
<button onclick="bluetoothScan()">Scan Bluetooth</button>
<div id="wifiOutput" class="output">Click scan to see nearby networks...</div>
</div>

</div>
</div>

<script>
async function api(path) {
    try {
        const r = await fetch(path);
        return await r.json();
    } catch(e) {
        return {error: e.message};
    }
}

function formatJSON(data) {
    return JSON.stringify(data, null, 2);
}

async function dnsLookup() {
    const d = document.getElementById('domain').value;
    if (!d) return;
    document.getElementById('domainOutput').textContent = 'Loading...';
    const data = await api(`/api/dns/${d}`);
    document.getElementById('domainOutput').textContent = formatJSON(data);
}

async function whoisLookup() {
    const d = document.getElementById('domain').value;
    if (!d) return;
    document.getElementById('domainOutput').textContent = 'Loading...';
    const data = await api(`/api/whois/${d}`);
    document.getElementById('domainOutput').textContent = formatJSON(data);
}

async function fullRecon() {
    const d = document.getElementById('domain').value;
    if (!d) return;
    document.getElementById('domainOutput').textContent = 'Running full recon...';
    const data = await api(`/api/recon/${d}`);
    document.getElementById('domainOutput').textContent = formatJSON(data);
}

async function certCheck() {
    const d = document.getElementById('domain').value;
    if (!d) return;
    document.getElementById('domainOutput').textContent = 'Checking SSL...';
    const data = await api(`/api/ssl/${d}`);
    document.getElementById('domainOutput').textContent = formatJSON(data);
}

async function portScan() {
    const h = document.getElementById('host').value;
    if (!h) return;
    document.getElementById('portOutput').textContent = 'Scanning...';
    const data = await api(`/api/ports/${h}`);
    document.getElementById('portOutput').textContent = formatJSON(data);
}

async function ipLookup() {
    const ip = document.getElementById('ip').value;
    if (!ip) return;
    document.getElementById('ipOutput').textContent = 'Loading...';
    const data = await api(`/api/ip/${ip}`);
    document.getElementById('ipOutput').textContent = formatJSON(data);
}

async function shodanLookup() {
    const ip = document.getElementById('ip').value;
    if (!ip) return;
    document.getElementById('ipOutput').textContent = 'Querying Shodan...';
    const data = await api(`/api/shodan/${ip}`);
    document.getElementById('ipOutput').textContent = formatJSON(data);
}

async function wifiScan() {
    document.getElementById('wifiOutput').textContent = 'Scanning WiFi...';
    const data = await api('/api/wifi');
    document.getElementById('wifiOutput').textContent = formatJSON(data);
}

async function bluetoothScan() {
    document.getElementById('wifiOutput').textContent = 'Scanning Bluetooth...';
    const data = await api('/api/bluetooth');
    document.getElementById('wifiOutput').textContent = formatJSON(data);
}
</script>
</body>
</html>
