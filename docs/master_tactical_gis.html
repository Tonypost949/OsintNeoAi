/* TACTICAL HUD TOP LEFT */

#hud-panel .stat-val { font-weight: bold; color: #00ffaa; }

    position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 1000;

    border-radius: 30px; padding: 8px 20px; color: #00ffaa; font-family: monospace;
    font-size: 12px; font-weight: bold; backdrop-filter: blur(14px);
    box-shadow: 0 0 25px rgba(0, 255, 170, 0.4), 0 10px 30px rgba(0, 0, 0, 0.9);
    display: flex; align-items: center; gap: 14px;
}
#cam-hud button {
    background: #0f172a; color: #00ffaa; border: 1px solid #00ffaa66; padding: 6px 14px;
    border-radius: 20px; font-family: monospace; font-size: 11px; font-weight: bold;
    cursor: pointer; transition: all 0.2s ease; outline: none;
}
#cam-hud button:hover { background: #00ffaa; color: #020617; box-shadow: 0 0 15px #00ffaa; }

/* QUICK JUMP COCKPIT TOP RIGHT */
#cockpit-jump {
    position: fixed; top: 12px; right: 12px; z-index: 1000;
    background: rgba(2, 6, 23, 0.94); border: 1px solid rgba(0, 255, 170, 0.4);

#cockpit-jump select {

    border-radius: 6px; font-family: monospace; font-size: 11px; outline: none; cursor: pointer;

/* 3D TILT SLIDER BOTTOM LEFT */
#tilt-controls {
    position: fixed; bottom: 12px; left: 12px; z-index: 1000;
    background: rgba(2, 6, 23, 0.92); border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px; padding: 8px 14px; color: #94a3b8; font-family: monospace; font-size: 11px;
    display: flex; align-items: center; gap: 12px; backdrop-filter: blur(8px);
}
#tilt-controls input[type=range] { accent-color: #00ffaa; cursor: pointer; width: 100px; }

        el.style.width = '16px';
        el.style.height = '16px';
        el.style.backgroundColor = loc.color;
        el.style.border = '2px solid #ffffff';

        el.style.boxShadow = `0 0 16px ${loc.color}, 0 0 8px #ffffff`;
        el.style.cursor = 'pointer';
        el.title = loc.name;

        const popup = new maplibregl.Popup({ offset: 25 }).setHTML(`

            <div class="popup-title">${loc.name}</div>

// CAMERA CONTROLS & TELEMETRY

map.on('pitch', updateCameraHUD);

function updateCameraHUD() {
    const pitch = Math.round(map.getPitch());
    const bearing = Math.round(map.getBearing());
    document.getElementById('hud-pitch-val').innerText = `${pitch}°`;
    document.getElementById('hud-bearing-val').innerText = `${bearing}°`;
    document.getElementById('pitch-slider').value = pitch;
    document.getElementById('pitch-display').innerText = `${pitch}°`;
    document.getElementById('bearing-slider').value = bearing;
    document.getElementById('bearing-display').innerText = `${bearing}°`;
}

function set3DPitch(val) { map.setPitch(parseFloat(val)); }
function set3DBearing(val) { map.setBearing(parseFloat(val)); }
function reset3DCamera() { map.easeTo({ pitch: 65, bearing: -20, duration: 1000 }); }

function jumpToLocation(index) {
    const loc = LOCATIONS[parseInt(index)];
    if (loc) {
        map.flyTo({
            center: loc.coords,
            zoom: loc.zoom,
            pitch: loc.pitch,
            bearing: loc.bearing,
            duration: 2500,
            essential: true
        });
    }
}

// AUTOPILOT RECON ORBIT

let autopilotIndex = 0;
let autopilotTimer = null;

function toggleAutopilot() {
    isAutopilot = !isAutopilot;
    const btn = document.getElementById('btn-autopilot');
    if (isAutopilot) {
        btn.innerText = "⏸️ PAUSE 3D RECON";
        btn.style.background = "#ef4444";
        btn.style.color = "#fff";
        
        function loop() {
            if (!isAutopilot) return;
            const loc = LOCATIONS[autopilotIndex];
            document.getElementById('jump-select').value = autopilotIndex;
            map.flyTo({
                center: loc.coords,
                zoom: loc.zoom,
                pitch: loc.pitch,
                bearing: loc.bearing,
                duration: 3500
            });
            autopilotIndex = (autopilotIndex + 1) % LOCATIONS.length;
            autopilotTimer = setTimeout(loop, 7000);
        }
        loop();
    } else {
        btn.innerText = "▶️ START 3D RECON ORBIT";
        btn.style.background = "#0f172a";
        btn.style.color = "#00ffaa";
        clearTimeout(autopilotTimer);
    }
