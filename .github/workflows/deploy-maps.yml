name: Deploy Maps to Azure & Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push GHCR Docker Image
        run: |
          docker build -f Dockerfile.maps -t ghcr.io/${{ github.repository_owner }}/osintneoai-maps:latest .
          docker push ghcr.io/${{ github.repository_owner }}/osintneoai-maps:latest

      - name: Azure Login
        uses: azure/login@v1
        continue-on-error: true
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Instances
        continue-on-error: true
        run: |
          az container create \
            --resource-group osintneoai-rg \
            --name osintneoai-maps \
            --image ghcr.io/${{ github.repository_owner }}/osintneoai-maps:latest \
            --os-type Linux \
            --cpu 1.0 \
            --memory 1.0 \
            --ports 10000 \
            --ip-address public \
            --environment-variables PORT=10000 \
            --no-wait || true
