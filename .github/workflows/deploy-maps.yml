name: Deploy Maps to Docker & Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: write-all

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Build & Push GHCR Docker Image
        run: |
          docker build -f Dockerfile.maps -t ghcr.io/${{ env.OWNER_LC }}/osintneoai-maps:latest .
          docker push ghcr.io/${{ env.OWNER_LC }}/osintneoai-maps:latest
