<!DOCTYPE html>
<html>
<head>
    <title>RICO National Strike Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { background: #0b0e14; color: #c8d0dc; font-family: sans-serif; margin: 0; padding: 0; }
        #map { height: 90vh; width: 100%; background: #0f121a; }
        .header { padding: 10px 20px; background: #141a24; border-bottom: 1px solid #1f2a3a; }
        h1 { margin: 0; color: #7ab7ff; font-size: 20px; }
    </style>
</head>
<body>
    <div class="header"><h1>RICO National Strike Infrastructure Map</h1></div>
    <div id="map"></div>
    <script>
        const map = L.map('map').setView([37.0902, -95.7129], 4);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CartoDB'
        }).addTo(map);

        const markers = [
            // OC Cities
            {lat: 33.6599, lng: -117.9992, color: 'red', label: 'Huntington Beach (RICO Node)'},
            {lat: 33.8366, lng: -117.9143, color: 'red', label: 'Anaheim (RICO Node)'},
            {lat: 33.8704, lng: -117.9242, color: 'red', label: 'Fullerton (RICO Node)'},
            {lat: 33.6411, lng: -117.9187, color: 'red', label: 'Costa Mesa (RICO Node)'},
            {lat: 33.7455, lng: -117.8677, color: 'red', label: 'Santa Ana (RICO Node)'},
            {lat: 33.7420, lng: -117.8239, color: 'red', label: 'Tustin (RICO Node)'},
            {lat: 33.7878, lng: -117.8531, color: 'red', label: 'Orange (RICO Node)'},
            
            // Liberty Entities
            {lat: 33.7701, lng: -118.1937, color: 'orange', label: 'Long Beach (Liberty Entity)'},
            {lat: 34.2011, lng: -118.5751, color: 'orange', label: 'Winnetka (Liberty Entity)'},
            
            // Sheriff Departments
            {lat: 41.8781, lng: -87.6298, color: 'blue', label: 'Cook County Sheriff (Investigation Active)'},
            {lat: 32.2226, lng: -110.9747, color: 'blue', label: 'Pima County Sheriff (FBI Probe)'},
            {lat: 35.1495, lng: -90.0490, color: 'blue', label: 'Shelby County Sheriff (High Risk)'},
            {lat: 34.0522, lng: -118.2437, color: 'blue', label: 'LA County Sheriff (Critical Exposure)'},
            
            // PPP Cluster
            {lat: 39.7392, lng: -104.9903, color: 'yellow', label: 'Denver PPP Cluster'},
            {lat: 40.7128, lng: -74.0060, color: 'yellow', label: 'NYC PPP Cluster'}
        ];

        markers.forEach(m => {
            L.circleMarker([m.lat, m.lng], {
                radius: 8,
                fillColor: m.color,
                color: '#fff',
                weight: 1,
                opacity: 1,
                fillOpacity: 0.8
            }).addTo(map).bindPopup(m.label);
        });
    </script>
</body>
</html>
