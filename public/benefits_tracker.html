body{background:#0a0a0f;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.header{background:linear-gradient(135deg,#0d1117 0%,#161b22 100%);border-bottom:1px solid #30363d;padding:20px 30px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.header h1{font-size:1.4em;color:#58a6ff}
.header .stats{display:flex;gap:20px;font-size:.9em}
.stat{padding:6px 14px;border-radius:20px;font-weight:600}
.stat.done{background:#1b4332;color:#2dd4bf}
.stat.progress{background:#3b2f00;color:#fbbf24}
.stat.todo{background:#1c1917;color:#a8a29e}
.stat.total{background:#1e1b4b;color:#a78bfa}
.stat.value{background:#14532d;color:#4ade80;font-size:1.1em}
.controls{padding:15px 30px;background:#0d1117;border-bottom:1px solid #1e2228;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.controls input{background:#161b22;border:1px solid #30363d;color:#e0e0e0;padding:8px 14px;border-radius:6px;width:300px;font-size:.9em}
.controls select{background:#161b22;border:1px solid #30363d;color:#e0e0e0;padding:8px 10px;border-radius:6px;font-size:.9em}
.controls button{padding:8px 16px;border-radius:6px;border:none;cursor:pointer;font-weight:600;font-size:.85em}
.btn-claim{background:#238636;color:#fff}
.btn-claim:hover{background:#2ea043}
.btn-export{background:#1f6feb;color:#fff}
.btn-export:hover{background:#388bfd}
.btn-reset{background:#da3633;color:#fff}
.grid{padding:15px 30px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85em}
th{background:#161b22;color:#8b949e;text-align:left;padding:10px 12px;border-bottom:2px solid #30363d;position:sticky;top:0;cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:#58a6ff}
td{padding:9px 12px;border-bottom:1px solid #1e2228;vertical-align:middle}
tr:hover{background:#161b22}
tr.done{opacity:.7}
tr.done td:first-child{text-decoration:line-through}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.78em;font-weight:600;white-space:nowrap}
.badge-done{background:#1b4332;color:#2dd4bf}
.badge-progress{background:#3b2f00;color:#fbbf24}
.badge-todo{background:#1c1917;color:#a8a29e}
.badge-skip{background:#27272a;color:#71717a}
.priority-critical{color:#f87171;font-weight:700}
.priority-high{color:#fbbf24;font-weight:600}
.priority-medium{color:#60a5fa}
.priority-low{color:#a8a29e}
.source-vsde{border-left:3px solid #a78bfa}
.source-github{border-left:3px solid #2dd4bf}
.source-edu{border-left:3px solid #f472b6}
.source-azure{border-left:3px solid #38bdf8}
a{color:#58a6ff;text-decoration:none}
a:hover{text-decoration:underline}
.value{color:#4ade80;font-weight:600}
.action-btn{padding:4px 10px;border-radius:4px;border:1px solid #30363d;background:#21262d;color:#c9d1d9;cursor:pointer;font-size:.8em}
.action-btn:hover{background:#30363d}
.action-btn.claimed{background:#1b4332;border-color:#2dd4bf;color:#2dd4bf}
.notes-cell{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notes-cell:hover{white-space:normal;overflow:visible}
.footer{padding:15px 30px;text-align:center;color:#484f58;font-size:.8em;border-top:1px solid #1e2228}
.category-tag{font-size:.75em;padding:2px 8px;border-radius:10px;background:#21262d;color:#8b949e;margin-left:4px}
@media(max-width:768px){.controls input{width:100%}.grid{padding:10px}}
</style>
</head>

<div class="header">

  </div>
</div>

<div class="controls">

    <option value="Communication">Communication</option>

  </select>
  <button class="btn-export" onclick="exportCSV()">📥 Export CSV</button>
  <button class="btn-export" onclick="exportJSON()">📥 Export JSON</button>
  <button class="btn-export" onclick="copyClaimList()">📋 Copy Unclaimed</button>
</div>

<div class="grid">
  <table id="benefitsTable">
    <thead>
      <tr>
        <th onclick="sortTable(0)">#</th>
        <th onclick="sortTable(1)">Benefit</th>
        <th onclick="sortTable(2)">Source</th>
        <th onclick="sortTable(3)">Category</th>
        <th onclick="sortTable(4)">Value</th>
        <th onclick="sortTable(5)">Priority</th>
        <th onclick="sortTable(6)">Status</th>
        <th>Claim URL</th>
        <th>Action</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="footer">

</div>

// Load saved state from localStorage
function loadState(){
  const saved = localStorage.getItem('osint_benefits_state');
  if(saved){
    const state = JSON.parse(saved);
    BENEFITS.forEach(b => {
      if(state[b.id]){
        b.status = state[b.id].status || b.status;
        b.notes = state[b.id].notes || b.notes;
      }
    });
  }
}
function saveState(){
  const state = {};
  BENEFITS.forEach(b => { state[b.id] = {status:b.status,notes:b.notes}; });
  localStorage.setItem('osint_benefits_state', JSON.stringify(state));
}

function getStatusBadge(s){
  const map = {DONE:'badge-done',IN_PROGRESS:'badge-progress',TODO:'badge-todo',SKIP:'badge-skip'};
  const labels = {DONE:'✅ Claimed',IN_PROGRESS:'🔄 In Progress',TODO:'⬜ Unclaimed',SKIP:'⏭ Skipped'};
  return `<span class="badge ${map[s]||'badge-todo'}">${labels[s]||s}</span>`;
}
function getPriorityClass(p){ return 'priority-'+(p||'low').toLowerCase(); }
function getSourceClass(s){
  if(s.includes('VSDE'))return 'source-vsde';
  if(s.includes('GitHub'))return 'source-github';
  if(s.includes('edu'))return 'source-edu';
  if(s.includes('Azure'))return 'source-azure';
  return '';
}

function cycleStatus(idx){
  const order = ['TODO','IN_PROGRESS','DONE','SKIP'];
  const cur = order.indexOf(BENEFITS[idx].status);
  BENEFITS[idx].status = order[(cur+1)%order.length];
  saveState();
  renderTable();
}

function editNotes(idx){
  const n = prompt('Notes for '+BENEFITS[idx].name+':', BENEFITS[idx].notes||'');
  if(n!==null){ BENEFITS[idx].notes=n; saveState(); renderTable(); }
}

function renderTable(){
  const body = document.getElementById('tableBody');
  const search = document.getElementById('searchBox').value.toLowerCase();
  const fStatus = document.getElementById('filterStatus').value;
  const fSource = document.getElementById('filterSource').value;
  const fCat = document.getElementById('filterCategory').value;
  let html='', shown=0, done=0, prog=0, todo=0, totalVal=0;
  BENEFITS.forEach((b,i) => {
    const match = (!search || b.name.toLowerCase().includes(search) || b.cat.toLowerCase().includes(search) || b.source.toLowerCase().includes(search) || (b.notes||'').toLowerCase().includes(search))
      && (!fStatus || b.status===fStatus)
      && (!fSource || b.source===fSource)
      && (!fCat || b.cat===fCat);
    if(b.status==='DONE')done++;
    if(b.status==='IN_PROGRESS')prog++;
    if(b.status==='TODO')todo++;
    totalVal += b.value||0;
    if(!match)return;
    shown++;
    html += `<tr class="${b.status==='DONE'?'done':''} ${getSourceClass(b.source)}">
      <td>${b.id}</td>
      <td><strong>${b.name}</strong></td>
      <td>${b.source}</td>
      <td>${b.cat}</td>
      <td class="value">${b.value>0?'$'+b.value.toLocaleString():'Free'}</td>
      <td class="${getPriorityClass(b.priority)}">${b.priority}</td>
      <td>${getStatusBadge(b.status)}</td>
      <td><a href="${b.url}" target="_blank">Claim →</a></td>
      <td>
        <button class="action-btn ${b.status==='DONE'?'claimed':''}" onclick="cycleStatus(${i})">Toggle</button>
        <button class="action-btn" onclick="editNotes(${i})">📝</button>
      </td>
      <td class="notes-cell" title="${(b.notes||'').replace(/"/g,'&quot;')}">${b.notes||'—'}</td>
    </tr>`;
  });
  body.innerHTML = html;
  document.getElementById('statTotal').textContent = BENEFITS.length+' Total';
  document.getElementById('statDone').textContent = done+' Claimed';
  document.getElementById('statProgress').textContent = prog+' In Progress';
  document.getElementById('statTodo').textContent = todo+' Unclaimed';
  document.getElementById('statValue').textContent = '$'+totalVal.toLocaleString()+' Total Value';
}
function filterTable(){ renderTable(); }

let sortCol=-1, sortAsc=true;
function sortTable(col){
  if(sortCol===col)sortAsc=!sortAsc; else{sortCol=col;sortAsc=true;}
  const keys = ['id','name','source','cat','value','priority','status'];
  const k = keys[col];
  BENEFITS.sort((a,b)=>{
    let va=a[k],vb=b[k];
    if(typeof va==='number')return sortAsc?va-vb:vb-va;
    va=(va||'').toString().toLowerCase();vb=(vb||'').toString().toLowerCase();
    return sortAsc?va.localeCompare(vb):vb.localeCompare(va);
  });
  renderTable();
}

function exportCSV(){
  let csv='ID,Name,Source,Category,Value,Priority,Status,URL,Notes\n';
  BENEFITS.forEach(b=>{csv+=`"${b.id}","${b.name}","${b.source}","${b.cat}",${b.value},"${b.priority}","${b.status}","${b.url}","${(b.notes||'').replace(/"/g,'""')}"\n`;});
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='benefits_tracker.csv';a.click();
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(BENEFITS,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='benefits_tracker.json';a.click();
}
function copyClaimList(){
  const unclaimed=BENEFITS.filter(b=>b.status==='TODO').map((b,i)=>`${i+1}. ${b.name} — ${b.url}`).join('\n');
  navigator.clipboard.writeText(unclaimed).then(()=>alert('Copied '+BENEFITS.filter(b=>b.status==='TODO').length+' unclaimed benefits to clipboard!'));
}

loadState();
renderTable();
</script>
