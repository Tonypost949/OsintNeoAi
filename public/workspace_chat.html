<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OSINT Neo AI - Investigator Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans">

    <!-- Header / Identity -->
    <header class="bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-blue-400"><i class="fa-solid fa-brain mr-2"></i>OSINT Neo AI</h1>
            <p class="text-xs text-gray-400">Wide-Open Intelligence Workspace</p>
        </div>
        <div class="flex items-center space-x-4">
            <span id="wallet-status" onclick="connectWallet()" class="text-sm bg-gray-700 px-3 py-1 rounded-full text-green-400 cursor-pointer hover:bg-gray-600 transition">Connect Wallet</span>
            <span class="text-sm bg-gray-700 px-3 py-1 rounded-full text-blue-300">OSINT: 150</span>
        </div>
    </header>

    <!-- Chat History Window -->
    <main id="chat-window" class="flex-1 overflow-y-auto p-6 space-y-6">
        <!-- AI Greeting -->
        <div class="flex items-start">
            <div class="bg-blue-600 rounded-full h-10 w-10 flex items-center justify-center font-bold mr-4">AI</div>
            <div class="bg-gray-800 p-4 rounded-lg shadow max-w-3xl">
                <p>Workspace initialized. I am your open-source intelligence assistant. You can type commands, upload FOIA documents, activate your camera to scan physical evidence, or use voice notes. What are we investigating today?</p>
            </div>
        </div>
    </main>

    <!-- Multimodal Input Area -->
    <footer class="bg-gray-800 p-4 border-t border-gray-700">
        <div class="max-w-4xl mx-auto relative flex items-center bg-gray-900 rounded-lg border border-gray-600 p-2">
            
            <!-- Hidden File Input -->
            <input type="file" id="file-upload" class="hidden" multiple>
            
            <!-- Media Action Buttons -->
            <button onclick="document.getElementById('file-upload').click()" class="text-gray-400 hover:text-blue-400 p-2 transition" title="Upload File">
                <i class="fa-solid fa-paperclip text-lg"></i>
            </button>
            <button id="btn-camera" class="text-gray-400 hover:text-blue-400 p-2 transition" title="Take Picture/Video">
                <i class="fa-solid fa-camera text-lg"></i>
            </button>
            <button id="btn-voice" class="text-gray-400 hover:text-blue-400 p-2 transition" title="Voice Input">
                <i class="fa-solid fa-microphone text-lg"></i>
            </button>

            <!-- Text Input -->
            <textarea id="chat-input" rows="1" class="flex-1 bg-transparent border-none focus:ring-0 text-white p-2 resize-none overflow-hidden" placeholder="Type your investigation query or drop evidence here..."></textarea>
            
            <!-- Submit Button -->
            <button id="btn-send" class="bg-blue-600 hover:bg-blue-500 text-white rounded-lg px-4 py-2 ml-2 transition">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </footer>

    <!-- Camera Viewfinder Modal -->
    <div id="camera-modal" class="fixed inset-0 bg-black/80 hidden z-50 flex flex-col items-center justify-center p-4">
        <div class="relative bg-gray-900 border border-gray-700 rounded-xl overflow-hidden max-w-lg w-full shadow-2xl">
            <video id="camera-stream" autoplay playsinline class="w-full h-72 object-cover bg-black"></video>
            <canvas id="snapshot-canvas" class="hidden"></canvas>
            <div class="p-4 flex justify-between items-center bg-gray-800 border-t border-gray-700">
                <button id="btn-cancel-cam" class="px-4 py-2 text-sm text-gray-300 hover:text-white transition">Cancel</button>
                <button id="btn-capture-frame" class="px-5 py-2 text-sm font-semibold bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition flex items-center">
                    <i class="fa-solid fa-camera mr-2"></i> Capture Evidence
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- DOM References ---
        const chatWindow = document.getElementById('chat-window');
        const chatInput = document.getElementById('chat-input');
        const fileUpload = document.getElementById('file-upload');
        const btnSend = document.getElementById('btn-send');
        const btnCamera = document.getElementById('btn-camera');
        const btnVoice = document.getElementById('btn-voice');

        const cameraModal = document.getElementById('camera-modal');
        const cameraStreamVideo = document.getElementById('camera-stream');
        const snapshotCanvas = document.getElementById('snapshot-canvas');
        const btnCancelCam = document.getElementById('btn-cancel-cam');
        const btnCaptureFrame = document.getElementById('btn-capture-frame');

        // --- Web3 Session State ---
        let WALLET_ADDRESS = null;
        let provider, signer, stakingGateContract;

        // IMPORTANT: Replace with the actual address from your Hardhat deployment
        const STAKING_GATE_ADDRESS = "0x_YOUR_STAKING_GATE_ADDRESS"; 
        const STAKING_GATE_ABI = [
            "function stakeAndSubmit(bytes32 _assetHash) external"
        ];

        let stagedFiles = [];
        let mediaStream = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecordingAudio = false;

        // ==========================================
        // Web3 Wallet Connection Hook
        // ==========================================
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.BrowserProvider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = await provider.getSigner();
                    WALLET_ADDRESS = await signer.getAddress();
                    
                    stakingGateContract = new ethers.Contract(STAKING_GATE_ADDRESS, STAKING_GATE_ABI, signer);
                    
                    document.getElementById('wallet-status').innerHTML = `Connected: ${WALLET_ADDRESS.substring(0,6)}...${WALLET_ADDRESS.slice(-4)}`;
                    appendSystemNotice("🟢 Web3 Wallet Connected. Ready for secure ingestion.");
                } catch (err) {
                    appendSystemNotice(`🔴 Wallet connection failed: ${err.message}`);
                }
            } else {
                alert("Please install MetaMask to use the investigator workspace.");
            }
        }

        // ==========================================
        // 1. File Upload Handler
        // ==========================================
        fileUpload.addEventListener('change', (e) => {
            for (const file of e.target.files) {
                stagedFiles.push(file);
                appendSystemNotice(`📎 Staged File: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`);
            }
            fileUpload.value = ""; // Reset input
        });

        // ==========================================
        // 2. Camera Snapshot (Evidence Scanner)
        // ==========================================
        btnCamera.addEventListener('click', async () => {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                cameraStreamVideo.srcObject = mediaStream;
                cameraModal.classList.remove('hidden');
            } catch (err) {
                alert("Unable to access camera: " + err.message);
            }
        });

        btnCaptureFrame.addEventListener('click', () => {
            if (!mediaStream) return;

            snapshotCanvas.width = cameraStreamVideo.videoWidth || 640;
            snapshotCanvas.height = cameraStreamVideo.videoHeight || 480;
            const ctx = snapshotCanvas.getContext('2d');
            ctx.drawImage(cameraStreamVideo, 0, 0, snapshotCanvas.width, snapshotCanvas.height);

            snapshotCanvas.toBlob((blob) => {
                const photoFile = new File([blob], `evidence_scan_${Date.now()}.jpg`, { type: "image/jpeg" });
                stagedFiles.push(photoFile);
                appendSystemNotice(`📷 Captured Frame: ${photoFile.name}`);
                closeCamera();
            }, "image/jpeg", 0.92);
        });

        btnCancelCam.addEventListener('click', closeCamera);

        function closeCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            cameraModal.classList.add('hidden');
        }

        // ==========================================
        // 3. Microphone Voice Recording
        // ==========================================
        btnVoice.addEventListener('click', async () => {
            if (!isRecordingAudio) {
                // Start Recording
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunks.push(e.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const voiceFile = new File([audioBlob], `voice_memo_${Date.now()}.webm`, { type: 'audio/webm' });
                        stagedFiles.push(voiceFile);
                        appendSystemNotice(`🎙️ Recorded Voice Memo: ${(audioBlob.size / 1024).toFixed(1)} KB`);
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecordingAudio = true;
                    btnVoice.classList.add('text-red-500', 'animate-pulse');
                    btnVoice.title = "Click to stop recording";
                } catch (err) {
                    alert("Microphone access denied: " + err.message);
                }
            } else {
                // Stop Recording
                mediaRecorder.stop();
                isRecordingAudio = false;
                btnVoice.classList.remove('text-red-500', 'animate-pulse');
                btnVoice.title = "Voice Input";
            }
        });

        // ==========================================
        // 4. Upgraded Dispatch Pipeline (With Staking)
        // ==========================================
        btnSend.addEventListener('click', dispatchPayload);

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                dispatchPayload();
            }
        });

        async function dispatchPayload() {
            if (!WALLET_ADDRESS) {
                alert("You must connect your Web3 wallet first to stake and submit evidence.");
                return connectWallet();
            }

            const messageText = chatInput.value.trim();
            if (!messageText && stagedFiles.length === 0) return;

            // 1. Render User Bubble
            appendUserBubble(messageText, stagedFiles);
            chatInput.value = "";
            const filesToSubmit = [...stagedFiles];
            stagedFiles = [];

            const loadingId = appendLoadingBubble();

            try {
                // 2. Client-Side Hash Generation (For the Smart Contract)
                // We generate a local hash of the file/message to lock in the StakingGate
                const payloadString = filesToSubmit.length > 0 ? filesToSubmit[0].name + Date.now() : messageText;
                const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(payloadString));
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const clientAssetHash = '0x' + hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

                // 3. Trigger MetaMask Staking Transaction [TASK-081]
                appendSystemNotice("⚠️ Please confirm the staking transaction in MetaMask to open the ingestion gate...");
                const tx = await stakingGateContract.stakeAndSubmit(clientAssetHash);
                await tx.wait(); // Wait for blockchain confirmation
                appendSystemNotice(`✅ Stake locked on-chain (Tx: ${tx.hash.substring(0,10)}...). Routing to Azure proxy.`);

                // 4. Proceed with original FormData POST to the Azure API
                const formData = new FormData();
                formData.append("wallet_address", WALLET_ADDRESS);
                formData.append("client_hash", clientAssetHash); // Pass the hash to the backend
                if (messageText) formData.append("message", messageText);
                filesToSubmit.forEach(file => formData.append("files", file));

                const response = await fetch("/api/workspace/chat", { method: "POST", body: formData });
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const data = await response.json();
                removeBubble(loadingId);
                appendAIBubble(data);

            } catch (err) {
                removeBubble(loadingId);
                appendAIBubble({ chat_reply: `⚠️ Transmission or Web3 Error: ${err.message}` });
            }
        }

        // ==========================================
        // 5. UI Render Helpers
        // ==========================================
        function appendUserBubble(text, files) {
            let mediaPills = files.map(f => `<span class="inline-block bg-blue-900 border border-blue-400 text-xs px-2 py-0.5 rounded-full mr-1 mb-1">📎 ${f.name}</span>`).join("");
            const html = `
                <div class="flex items-start justify-end">
                    <div class="bg-blue-800 p-4 rounded-xl shadow max-w-2xl text-white">
                        ${mediaPills ? `<div class="mb-2">${mediaPills}</div>` : ''}
                        ${text ? `<p class="whitespace-pre-wrap">${escapeHtml(text)}</p>` : ''}
                    </div>
                    <div class="bg-gray-600 rounded-full h-10 w-10 flex items-center justify-center font-bold ml-3 flex-shrink-0">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>`;
            chatWindow.insertAdjacentHTML('beforeend', html);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function appendAIBubble(data) {
            let ingestPill = "";
            if (data.ingestion) {
                const hashShort = data.ingestion.asset_hash.substring(0, 10);
                ingestPill = `
                    <div class="mb-3 p-2 bg-gray-900 border border-green-500/40 rounded-lg text-xs font-mono text-green-300">
                        <i class="fa-solid fa-shield-halved mr-1 text-green-400"></i>
                        <strong>Point-of-Upload Hash:</strong> ${hashShort}... | 
                        <strong>Tags:</strong> [${data.ingestion.domain_tags.join(', ')}] | 
                        <strong>Ledger:</strong> Append-Only V${data.ingestion.version_id} Enqueued
                    </div>`;
            }

            const html = `
                <div class="flex items-start">
                    <div class="bg-blue-600 rounded-full h-10 w-10 flex items-center justify-center font-bold mr-3 flex-shrink-0">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div class="bg-gray-800 border border-gray-700 p-4 rounded-xl shadow max-w-3xl text-gray-100">
                        ${ingestPill}
                        <p class="whitespace-pre-wrap leading-relaxed">${escapeHtml(data.chat_reply || "Evidence received and logged.")}</p>
                    </div>
                </div>`;
            chatWindow.insertAdjacentHTML('beforeend', html);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function appendLoadingBubble() {
            const id = "load-" + Date.now();
            const html = `
                <div id="${id}" class="flex items-start">
                    <div class="bg-blue-600 rounded-full h-10 w-10 flex items-center justify-center font-bold mr-3 flex-shrink-0">
                        <i class="fa-solid fa-circle-notch fa-spin"></i>
                    </div>
                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow text-gray-400 italic">
                        Analyzing evidence & routing to micro-workers...
                    </div>
                </div>`;
            chatWindow.insertAdjacentHTML('beforeend', html);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return id;
        }

        function appendSystemNotice(text) {
            const html = `<div class="text-center text-xs text-gray-400 italic py-1">${text}</div>`;
            chatWindow.insertAdjacentHTML('beforeend', html);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function removeBubble(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

    </script>
</body>
</html>
