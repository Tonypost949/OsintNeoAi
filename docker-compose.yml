version: '3.8'

services:
  osintneoai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osintneoai-app
    ports:
      - "8080:10000"
    environment:
      - PORT=10000
      - ENVIRONMENT=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
    volumes:
      - ./reports_output:/app/reports_output
      - ./results:/app/results
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - osint-network

  kali-osint:
    build:
      context: .
      dockerfile: Dockerfile.kali
    container_name: osintneoai-kali-tools
    ports:
      - "9090:9090"
    volumes:
      - ./evidence:/osint_kali/evidence
      - ./data:/osint_kali/data
    restart: unless-stopped
    networks:
      - osint-network

networks:
  osint-network:
    driver: bridge
