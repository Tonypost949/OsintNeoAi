version: '3.8'

services:
  osintneoai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osintneoai-app
    ports:
      - "10000:10000"
    environment:
      - PORT=10000
      - ENVIRONMENT=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
    volumes:
      - ./reports_output:/app/reports_output
      - ./results:/app/results
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - osint-network

networks:
  osint-network:
    driver: bridge
