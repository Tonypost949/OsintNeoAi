<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSINTNeoAI — Dynamic Investigation Wiki & Graph Intake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #090c10;
      --bg-surface: #0e131d;
      --bg-card: #151c28;
      --border-subtle: #212c3e;
      --border-accent: rgba(0, 229, 255, 0.4);
      --accent-cyan: #00e5ff;
      --accent-green: #22c55e;
      --accent-gold: #f59e0b;
      --accent-blue: #38bdf8;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --wiki-link: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Header */
    header {
      height: 60px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(9, 12, 16, 0.95);
      backdrop-filter: blur(12px);
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      background: var(--accent-cyan);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-cyan);
    }

    .nav-tabs {
      display: flex;
      gap: 6px;
      background: var(--bg-surface);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    .nav-tab {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      transition: all 0.2s;
    }

    .nav-tab.active {
      background: var(--bg-card);
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .quota-badge {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    .quota-badge strong { color: var(--accent-cyan); }

    /* Layout Containers */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
      position: relative;
    }

    /* Input Chat Box */
    .chat-box-container {
      max-width: 820px;
      width: 100%;
      margin-bottom: 24px;
      transition: all 0.3s ease;
    }

    .input-wrapper {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 16px 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--accent-cyan);
      box-shadow: 0 8px 30px rgba(0, 229, 255, 0.12);
    }

    textarea {
      width: 100%;
      min-height: 60px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 15px;
      line-height: 1.5;
      resize: none;
    }

    .input-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .input-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    .build-btn {
      background: var(--accent-cyan);
      color: #000;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }

    .build-btn:hover { opacity: 0.9; }

    /* The Animated Wiki Canvas */
    .wiki-viewport {
      max-width: 820px;
      width: 100%;
      display: none;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 60px;
    }

    /* Wiki Breadcrumbs */
    .wiki-breadcrumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
    }

    .breadcrumb-item {
      cursor: pointer;
      color: var(--wiki-link);
      text-decoration: underline;
    }

    .breadcrumb-item.current {
      color: var(--text-primary);
      text-decoration: none;
      cursor: default;
    }

    /* The Wikipedia Document Card */
    .wiki-article {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 32px;
      position: relative;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .wiki-header {
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 16px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .wiki-title {
      font-family: 'Newsreader', serif;
      font-size: 34px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .wiki-entity-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--accent-cyan);
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid rgba(0, 229, 255, 0.2);
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 6px;
    }

    .wiki-content-grid {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 28px;
    }

    .wiki-main-body {
      font-size: 15px;
      line-height: 1.7;
      color: #e2e8f0;
    }

    .wiki-main-body p {
      margin-bottom: 16px;
    }

    .wiki-sublink {
      color: var(--wiki-link);
      text-decoration: none;
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.4);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .wiki-sublink:hover {
      background: rgba(56, 189, 248, 0.25);
      border-bottom-color: var(--wiki-link);
    }

    /* Wikipedia Infobox Sidebar */
    .wiki-infobox {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 16px;
      font-size: 12.5px;
      align-self: start;
    }

    .infobox-title {
      font-weight: 700;
      text-align: center;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 8px;
      margin-bottom: 12px;
      font-size: 13.5px;
      color: var(--accent-cyan);
    }

    .infobox-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .infobox-label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .infobox-val {
      color: var(--text-primary);
      text-align: right;
      font-weight: 600;
    }

    /* Multigo Graph Drawer */
    .maltego-bar {
      margin-top: 24px;
      padding: 14px 18px;
      background: rgba(14, 19, 29, 0.9);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    .maltego-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .maltego-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 3px 8px;
      border-radius: 4px;
    }

    /* Animated Building Indicator */
    .building-stream {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      border-right: 2px solid var(--accent-cyan);
      animation: typing 1s steps(20, end), blink 0.75s step-end infinite;
    }

    @keyframes blink {
      from, to { border-color: transparent }
      50% { border-color: var(--accent-cyan); }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="brand">
      <div class="brand-dot"></div>
      <span>OSINTNeoAI</span>
    </div>

    <div class="nav-tabs">
      <button class="nav-tab active" id="tabWiki" onclick="switchView('wiki')">📖 Dynamic Wiki View</button>
      <button class="nav-tab" id="tabGraph" onclick="switchView('graph')">🕸️ Multigo Node View</button>
    </div>

    <div class="header-right">
      <div class="quota-badge">Investigations: <strong id="quotaCount">3 of 3</strong></div>
    </div>
  </header>

  <!-- Workspace Canvas -->
  <main>
    <!-- Story Intake Chat Box -->
    <div class="chat-box-container" id="chatContainer">
      <div class="input-wrapper">
        <textarea id="storyInput" placeholder="Tell your story (e.g. 'I went to the car at 17642 Beach Blvd and contacted the Huntington Beach Police Department...')" rows="3"></textarea>
        <div class="input-footer">
          <div class="input-hint">✨ The first subject will generate your primary Wiki Page with clickable entity subsets.</div>
          <button class="build-btn" onclick="startDynamicBuild()">
            <span>Build Wiki Page</span>
            <span>→</span>
          </button>
        </div>
      </div>
    </div>

    <!-- The Generated Interactive Wiki Viewport -->
    <div class="wiki-viewport" id="wikiViewport">
      <!-- Breadcrumb Hierarchy Trail -->
      <div class="wiki-breadcrumbs" id="breadcrumbs"></div>

      <!-- Current Active Wiki Article -->
      <div class="wiki-article" id="articleCard"></div>

      <!-- Backend Multigo Relationship Bridge Bar -->
      <div class="maltego-bar">
        <div class="maltego-info">
          <span class="maltego-badge">Multigo Link Active</span>
          <span id="maltegoRelationText">maltego.Person ──[OPERATES]──> maltego.Vehicle</span>
        </div>
        <div style="font-size: 12px; color: var(--text-muted);">
          Mirrored to Lockbox: <code style="color:var(--accent-cyan);">evidence/maltego_MUNICIPAL-CASE-001.mtgl</code>
        </div>
      </div>
    </div>
  </main>

  <script>
    // In-memory structured Wiki Encyclopedia Graph
    let wikiPages = {};
    let pageHistory = [];
    let currentActivePageId = null;

    function startDynamicBuild() {
      const input = document.getElementById('storyInput');
      const text = input.value.trim();
      if (!text) return;

      // Extract subjects and entities from narrative
      const graph = parseStoryToWiki(text);
      wikiPages = graph.pages;
      
      // The first entity/subject becomes the Root Wiki Page
      navigateToPage(graph.rootId);

      document.getElementById('wikiViewport').style.display = 'flex';
      input.value = '';
    }

    function parseStoryToWiki(story) {
      const pages = {};
      
      // Determine the primary actor/subject (first entity or 'Investigator / Reporter')
      let rootTitle = "Investigator (Primary Subject)";
      if (story.toLowerCase().startsWith("i ") || story.toLowerCase().includes(" i ")) {
        rootTitle = "First-Person Witness (The Subject)";
      } else {
        const words = story.split(' ');
        if (words.length > 1) rootTitle = words[0] + " " + words[1];
      }
      const rootId = "root_subject";

      // Identify Subsets / Entities mentioned in narrative
      const detectedSubsets = [];

      // 1. Check for Vehicle / Car
      if (/car|vehicle|truck|automobile/i.test(story)) {
        detectedSubsets.push({
          id: "entity_vehicle",
          label: "The Vehicle",
          type: "maltego.Vehicle",
          infobox: { "Type": "Passenger Vehicle", "Relation": "Operated by Subject", "Status": "Active Evidence" },
          content: "The motor vehicle referenced in the primary narrative. Utilized during the documented transit to the scene of investigation. Connected as a primary physical asset under the custody and control of the reporting subject."
        });
      }

      // 2. Check for Address / Location
      const addrMatch = story.match(/\d{3,5}\s+[A-Za-z\s]+(Boulevard|Blvd|Lane|Ave|Street|St|Road|Rd)/i);
      if (addrMatch) {
        detectedSubsets.push({
          id: "entity_location",
          label: addrMatch[0].trim(),
          type: "maltego.Location",
          infobox: { "Classification": "Real Property Parcel", "Jurisdiction": "Orange County", "Status": "Flagged Toxic Site" },
          content: `Real estate property location documented as the scene of primary incident. Cross-referenced in municipal records against environmental CEQA filings and public facility contracts.`
        });
      }

      // 3. Check for Municipal Police or Agency
      const agencyMatch = story.match(/(Huntington Beach Police|HBPD|Irvine Police|Santa Monica Police|Public Works|City of [A-Za-z\s]+)/i);
      if (agencyMatch) {
        detectedSubsets.push({
          id: "entity_agency",
          label: agencyMatch[0].trim(),
          type: "maltego.Organization",
          infobox: { "Entity Type": "Law Enforcement Agency", "Perimeter Security": "High Risk / Open Ports", "Authority": "Municipal" },
          content: `Public sector agency identified in the formal narrative. Cross-referenced in the OSINTNeoAI exposure registry with verified network and public record footprints.`
        });
      }

      // Build Root Page
      let rootBodyHtml = story;
      detectedSubsets.forEach(subset => {
        // Replace mentions in story with interactive clickable Wiki Sublinks
        const regex = new RegExp(`(${subset.label}|car|vehicle)`, 'gi');
        rootBodyHtml = rootBodyHtml.replace(regex, `<a class="wiki-sublink" onclick="navigateToPage('${subset.id}')">$1</a>`);
      });

      pages[rootId] = {
        title: rootTitle,
        entityType: "maltego.Person",
        bodyHtml: rootBodyHtml,
        infobox: { "Role": "Primary Witness / Actor", "Intake Node": "Level 1 Root", "Verification": "Compliant Lockbox" },
        subsets: detectedSubsets
      };

      // Register Sub-Pages for each subset
      detectedSubsets.forEach(sub => {
        pages[sub.id] = {
          title: sub.label,
          entityType: sub.type,
          bodyHtml: `<p>${sub.content}</p><p>This page represents a dedicated subset node spawned directly from the primary report. Click the breadcrumbs above to revert to the parent subject page.</p>`,
          infobox: sub.infobox,
          subsets: []
        };
      });

      return { rootId, pages };
    }

    function navigateToPage(pageId) {
      if (!wikiPages[pageId]) return;

      currentActivePageId = pageId;
      const page = wikiPages[pageId];

      // Update Breadcrumbs
      if (!pageHistory.includes(pageId)) {
        pageHistory.push(pageId);
      } else {
        // If backtracking, slice history to current
        pageHistory = pageHistory.slice(0, pageHistory.indexOf(pageId) + 1);
      }
      renderBreadcrumbs();

      // Render Wiki Card
      const card = document.getElementById('articleCard');
      card.innerHTML = `
        <div class="wiki-header">
          <div>
            <h1 class="wiki-title">${page.title}</h1>
            <span class="wiki-entity-tag">${page.entityType}</span>
          </div>
          <div style="font-size: 12px; color: var(--text-muted);">
            Wikipedia Standard Format • Scoped Local Node
          </div>
        </div>

        <div class="wiki-content-grid">
          <div class="wiki-main-body">
            <p>${page.bodyHtml}</p>
          </div>

          <!-- Wikipedia Infobox -->
          <div class="wiki-infobox">
            <div class="infobox-title">${page.title}</div>
            ${Object.entries(page.infobox).map(([k, v]) => `
              <div class="infobox-row">
                <span class="infobox-label">${k}</span>
                <span class="infobox-val">${v}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      // Update Multigo Relationship Bar
      const relBar = document.getElementById('maltegoRelationText');
      if (pageId === "root_subject") {
        relBar.textContent = `maltego.Person ──[INTAKE_ROOT]──> ${Object.keys(wikiPages).length - 1} Connected Sub-Nodes`;
      } else {
        relBar.textContent = `maltego.Person ──[ATTACHED_SUBSET]──> ${page.entityType} (${page.title})`;
      }
    }

    function renderBreadcrumbs() {
      const bc = document.getElementById('breadcrumbs');
      bc.innerHTML = pageHistory.map((pid, idx) => {
        const p = wikiPages[pid];
        const isCurrent = idx === pageHistory.length - 1;
        if (isCurrent) {
          return `<span class="breadcrumb-item current">${p.title}</span>`;
        } else {
          return `<span class="breadcrumb-item" onclick="navigateToPage('${pid}')">${p.title}</span> <span>›</span>`;
        }
      }).join(' ');
    }

    function switchView(view) {
      document.getElementById('tabWiki').classList.toggle('active', view === 'wiki');
      document.getElementById('tabGraph').classList.toggle('active', view === 'graph');
      if (view === 'graph') {
        alert("Multigo Node Graph compiled in backend evidence locker: /storage/2004-1014/Amd949609_Antigravity_v1/evidence/maltego_MUNICIPAL-CASE-001.mtgl");
      }
    }
  </script>
</body>
</html>
