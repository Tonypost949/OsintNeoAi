": "Information", "Message": null}, {"TimeCreated": "2026-11-19 12:48:20", "ProviderName": "Microsoft-Windows-Configuration-Change-Monitor", "Id": 1, "LevelDisplayName": "Information", "Message": null}, {"TimeCreated": "2026-11-19 12:45:50", "ProviderName": "Microsoft-Windows-Configuration-Change-Monitor", "Id": 1, "LevelDisplayName": "Information", "Message": null}, {"TimeCreated": "2026-11-19 12:43:41", "ProviderName": "Service Control Manager", "Id": 7040, "LevelDisplayName": "Information", "Message": "The start type of the Background Intelligent Transfer Service service was changed from auto start to demand start."}, {"TimeCreated": "2026-11-19 12:43:13", "ProviderName": "Microsoft-Windows-Configuration-Change-Monitor", "Id": 1, "LevelDisplayName": "Information", "Message": null}, {"TimeCreated": "2026-11-19 12:41:16", "ProviderName": "Microsoft-Windows-Configuration-Change-Monitor", "Id": 1, "LevelDisplayName": "Information", "Message": null}, {"TimeCreated": "2026-11-19 12:40:20", "ProviderName": "Service Control Manager", "Id": 7040, "LevelDisplayName": "Information", "Message": "The start type of the Background Intelligent Transfer Service service was changed from demand start to auto start."}]};
        let currentTab = 'active';

        function formatStorageSize(bytes) {
            if (bytes === undefined || bytes === null || isNaN(bytes)) return '-';
            const b = Number(bytes);
            if (b < 1024) {
                return (b / 1024).toFixed(2) + ' KB';
            } else if (b < 1024 * 1024) {
                return (b / 1024).toFixed(2) + ' KB';
            } else if (b < 1024 * 1024 * 1024) {
                return (b / (1024 * 1024)).toFixed(2) + ' MB';
            } else if (b < 1024 * 1024 * 1024 * 1024) {
                return (b / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
            } else {
                return (b / (1024 * 1024 * 1024 * 1024)).toFixed(2) + ' TB';
            }
        }

        function initStats() {
            const activeCnt = (taskData.active_and_queued || []).length;
            const completedCnt = (taskData.completed || []).length;
            const ledgerCnt = (taskData.ledger_history || []).length;
            const auditCnt = (taskData.audit_logs || []).length;
            const winCnt = (taskData.win_events || []).length;

            document.getElementById('stat-active').innerText = activeCnt;
            document.getElementById('stat-completed').innerText = completedCnt;
            document.getElementById('stat-ledger').innerText = ledgerCnt;
            document.getElementById('stat-audit').innerText = auditCnt;
            document.getElementById('stat-win').innerText = winCnt;

            document.getElementById('tab-cnt-active').innerText = activeCnt;
            document.getElementById('tab-cnt-completed').innerText = completedCnt;
            document.getElementById('tab-cnt-ledger').innerText = ledgerCnt;
            document.getElementById('tab-cnt-audit').innerText = auditCnt;
            document.getElementById('tab-cnt-win').innerText = winCnt;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderCards();
        }

        function renderCards() {
            const query = (document.getElementById('searchInput').value || '').toLowerCase();
            const grid = document.getElementById('cardGrid');
            const auditContainer = document.getElementById('auditContainer');
            const winContainer = document.getElementById('winContainer');

            grid.style.display = 'none';
            auditContainer.style.display = 'none';
            winContainer.style.display = 'none';

            if (currentTab === 'audit') {
                auditContainer.style.display = 'block';
                renderAuditTable(query);
                return;
            } else if (currentTab === 'winevent') {
                winContainer.style.display = 'block';
                renderWinEventTable(query);
                return;
            }

            grid.style.display = 'grid';
            grid.innerHTML = '';

            let items = [];
            if (currentTab === 'active') {
                items = taskData.active_and_queued || [];
            } else if (currentTab === 'completed') {
                items = taskData.completed || [];
            } else if (currentTab === 'ledger') {
                items = taskData.ledger_history || [];
            }

            const filtered = items.filter(item => {
                const str = JSON.stringify(item).toLowerCase();
                return str.includes(query);
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 3rem;">No tasks matching your search.</div>';
                return;
            }

            filtered.forEach(t => {
                const card = document.createElement('div');
                card.className = 'task-card';

                const id = t.task_id || t.id || 'LEDGER-ENTRY';
                const status = t.status || (currentTab === 'active' ? 'QUEUED' : 'COMPLETED');
                const badgeClass = status.toUpperCase().includes('COMPLETED') ? 'badge-completed' : 'badge-queued';
                const category = t.category || 'General';
                const summary = t.summary || t.action || t.title || t.description || 'Task Details';
                const timestamp = t.timestamp || t.last_updated || 'Active';

                let metaHtml = `
                    <div class="meta-row">
                        <span>Timestamp:</span>
                        <span class="meta-val">${timestamp}</span>
                    </div>
                `;

                if (t.evidence_path) {
                    metaHtml += `
                        <div class="meta-row">
                            <span>Evidence:</span>
                            <span class="meta-val">${t.evidence_path}</span>
                        </div>
                    `;
                }
                if (t.tool_path) {
                    metaHtml += `
                        <div class="meta-row">
                            <span>Tool:</span>
                            <span class="meta-val">${t.tool_path}</span>
                        </div>
                    `;
                }
                if (t.raw_snippet && currentTab === 'ledger') {
                    metaHtml += `
                        <div style="margin-top: 0.4rem; font-family: monospace; font-size: 0.72rem; color: #94a3b8; white-space: pre-wrap;">${t.raw_snippet}</div>
                    `;
                }

                card.innerHTML = `
                    <div class="card-header">
                        <span class="task-id">${id}</span>
                        <div style="display: flex; gap: 0.4rem;">
                            <span class="badge badge-category">${category}</span>
                            <span class="badge ${badgeClass}">${status}</span>
                        </div>
                    </div>
                    <div class="task-summary">${summary}</div>
                    <div class="task-meta">${metaHtml}</div>
                `;
                grid.appendChild(card);
            });
        }

        function renderAuditTable(query) {
            const auditContainer = document.getElementById('auditContainer');
            const items = taskData.audit_logs || [];
            const filtered = items.filter(e => {
                const str = `${e.timestamp_local} ${e.timestamp_utc} ${e.app_name} ${e.status} ${e.action} ${e.target} ${JSON.stringify(e.details || {})}`.toLowerCase();
                return str.includes(query);
            });

            const reversed = [...filtered].reverse();

            let rows = '';
            reversed.forEach(e => {
                let statusClass = "status-badge-success";
                if ((e.status || '').includes("ERR") || (e.status || '').includes("FAIL")) {
                    statusClass = "status-badge-err";
                } else if ((e.status || '').includes("SKIP") || (e.status || '').includes("WARN")) {
                    statusClass = "status-badge-warn";
                }

                let detailStr = e.target || '';
                if (e.details && Object.keys(e.details).length > 0) {
                    if (e.details.sha256) {
                        detailStr += ` | <span style="color: var(--accent-cyan);">SHA256: ${e.details.sha256.substring(0, 12)}...</span>`;
                    }
                    if (e.details.size_bytes !== undefined) {
                        detailStr += ` | ${formatStorageSize(e.details.size_bytes)}`;
                    }
                    if (e.details.files_routed !== undefined) {
                        detailStr += ` | Routed: ${e.details.files_routed} files`;
                    }
                    if (e.details.files_purged !== undefined) {
                        const freedFormatted = formatStorageSize(e.details.bytes_freed || 0);
                        detailStr += ` | Purged: ${e.details.files_purged} files (${freedFormatted} freed)`;
                    }
                }

                rows += `
                    <tr>
                        <td style="color: #94a3b8; width: 175px;">${e.timestamp_local || '-'}</td>
                        <td style="color: #64748b; width: 205px;">${e.timestamp_utc || '-'}</td>
                        <td style="width: 100px; font-weight: 600; color: #e2e8f0;">${e.app_name || '-'}</td>
                        <td style="width: 120px;" class="${statusClass}">${e.status || '-'}</td>
                        <td style="width: 150px; color: #38bdf8;">${e.action || '-'}</td>
                        <td>${detailStr}</td>
                    </tr>
                `;
            });

            if (reversed.length === 0) {
                rows = '<tr><td colspan="6" style="text-align: center; color: #64748b; padding: 25px;">No audit log records match the search.</td></tr>';
            }

            auditContainer.innerHTML = `
                <div class="audit-table-wrap">
                    <table class="audit-table">
                        <thead>
                            <tr>
                                <th>Local Timestamp</th>
                                <th>UTC Timestamp</th>
                                <th>App / Module</th>
                                <th>Status</th>
                                <th>Action</th>
                                <th>Target Path / Forensic Details</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderWinEventTable(query) {
            const winContainer = document.getElementById('winContainer');
            const items = taskData.win_events || [];
            const filtered = items.filter(e => {
                const str = `${e.TimeCreated} ${e.ProviderName} ${e.Id} ${e.LevelDisplayName} ${e.Message}`.toLowerCase();
                return str.includes(query);
            });

            let rows = '';
            filtered.forEach(e => {
                let lvlClass = "status-badge-success";
                const lvl = (e.LevelDisplayName || '').toLowerCase();
                if (lvl.includes('error') || lvl.includes('crit')) {
                    lvlClass = "status-badge-err";
                } else if (lvl.includes('warn')) {
                    lvlClass = "status-badge-warn";
                }

                rows += `
                    <tr>
                        <td style="color: #94a3b8; width: 170px;">${e.TimeCreated || '-'}</td>
                        <td style="color: #cbd5e1; width: 200px; font-weight: 600;">${e.ProviderName || '-'}</td>
                        <td style="width: 70px; color: var(--accent-cyan); font-weight: bold;">${e.Id || '-'}</td>
                        <td style="width: 110px;" class="${lvlClass}">${e.LevelDisplayName || '-'}</td>
                        <td>${e.Message || '-'}</td>
                    </tr>
                `;
            });

            if (filtered.length === 0) {
                rows = '<tr><td colspan="5" style="text-align: center; color: #64748b; padding: 25px;">No Windows Event records match the search.</td></tr>';
            }

            winContainer.innerHTML = `
                <div class="audit-table-wrap">
                    <table class="audit-table">
                        <thead>
                            <tr>
                                <th>Event Timestamp</th>
                                <th>Provider / Source</th>
                                <th>Event ID</th>
                                <th>Severity</th>
                                <th>Windows Event Message / Payload</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows}
                        </tbody>
                    </table>
                </div>
            `;
        }

        initStats();
        renderCards();
    </script>
</body>
