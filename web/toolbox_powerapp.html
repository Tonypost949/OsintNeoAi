            document.querySelectorAll('.filter-btn').forEach(btn => {

                const card = document.createElement('div');
                card.className = 'tool-card';

                const sizeText = t.is_dir ? 'DIR' : `${t.size_kb} KB`;
                const tagClass = getTagClass(t.category);

                card.innerHTML = `
                    <div class="card-top">
                        <div class="tool-name">${t.name}</div>
                        <span class="category-tag ${tagClass}">${t.category}</span>
                    </div>
                    <div class="tool-desc">${t.description}</div>
                    <div class="card-footer">
                        <span class="meta-text">${sizeText} • ${t.modified}</span>
                        <button class="action-btn" onclick="copyPath('${t.path.replace(/\\/g, '\\\\')}')">Copy Path</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        computeStats();
        renderGrid();
    </script>
</body>
</html>
