[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teamwork_project"
version = "0.1.0"
description = "OSINT Data Correlation Pipeline, Graph Engine & Interactive Dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "OSINT Neo Team", email = "dev@osintneo.org" }
]

dependencies = [
    "pydantic>=2.0.0",
    "rapidfuzz>=3.0.0",
    "networkx>=3.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "streamlit>=1.25.0",
    "httpx>=0.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0"
]

[project.scripts]
generate-mock-data = "src.engine.mock_generator:main"
start-api = "src.api.app:main"
start-dashboard = "src.dashboard.app:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --verbose"
testpaths = [
    "tests"
]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
