<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSINT Neo AI — Planetary Reconnaissance & Intelligence Cockpit (God's Eye)</title>
  
  <!-- Tailwind CSS & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet GIS Map Engine CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      background-color: #080c14;
      color: #e2e8f0;
      font-family: 'Rajdhani', sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .orbitron { font-family: 'Orbitron', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    #map { width: 100vw; height: 100vh; z-index: 1; }
    .glass-panel {
      background: rgba(11, 17, 32, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 189, 248, 0.25);
    }
    .hud-badge {
      transition: all 0.2s ease;
    }
    .hud-badge:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.6);
    }
  </style>
</head>
<body>

  <!-- TOP HUD NAVIGATION & CATEGORY FILTER BAR -->
  <div class="absolute top-4 left-4 right-4 z-50 flex flex-wrap items-center justify-between glass-panel p-3.5 rounded-xl shadow-2xl gap-3">
    <div class="flex items-center gap-3">
      <div class="w-3.5 h-3.5 rounded-full bg-cyan-400 animate-ping"></div>
      <h1 class="orbitron text-lg font-bold tracking-wider text-cyan-400">OSINT NEO AI — OSINT EYE VIEW</h1>
    </div>
    
    <!-- CATEGORY FILTER TOGGLES -->
    <div class="flex items-center gap-2 text-xs mono">
      <button onclick="filterCategory('all')" class="hud-badge px-2.5 py-1 rounded bg-cyan-500/20 border border-cyan-400 text-cyan-300 font-bold">ALL</button>
      <button onclick="filterCategory('Surveillance')" class="hud-badge px-2.5 py-1 rounded bg-red-500/20 border border-red-400/40 text-red-300">SURVEILLANCE</button>
      <button onclick="filterCategory('Municipal')" class="hud-badge px-2.5 py-1 rounded bg-blue-500/20 border border-blue-400/40 text-blue-300">MUNICIPAL</button>
      <button onclick="filterCategory('Corporate')" class="hud-badge px-2.5 py-1 rounded bg-emerald-500/20 border border-emerald-400/40 text-emerald-300">CORPORATE</button>
    </div>

    <!-- ACTION LINKS -->
    <div class="flex items-center gap-3 text-xs mono text-slate-400">
      <a href="/map/3d" class="px-2.5 py-1 bg-purple-500/20 hover:bg-purple-500/40 border border-purple-400/40 rounded text-purple-300 transition">🏙️ 3D WEBGL</a>
      <a href="/grid" class="px-2.5 py-1 bg-amber-500/20 hover:bg-amber-500/40 border border-amber-400/40 rounded text-amber-300 transition">📊 SYNCFUSION GRID</a>
      <div class="hidden sm:block">STATUS: <span class="text-emerald-400 font-bold">ONLINE</span></div>
    </div>
  </div>

  <!-- LEAFLET GIS MAP CONTAINER -->
  <div id="map"></div>

  <!-- FLOATING HUD ENTITY DOSSIER DRAWER (CLICK-TO-INSPECT) -->
  <div id="dossier-panel" class="absolute top-20 right-4 z-50 w-96 max-h-[75vh] glass-panel p-4 rounded-xl overflow-y-auto hidden border-cyan-500/40 shadow-2xl">
    <div class="flex items-center justify-between pb-2 border-b border-cyan-500/20 mb-3">
      <h2 class="orbitron text-sm font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-2">
        <i class="fa-solid fa-crosshairs text-cyan-400"></i> Entity Dossier
      </h2>
      <button onclick="closeDossier()" class="text-slate-400 hover:text-white mono font-bold text-sm">✕</button>
    </div>
    <div id="dossier-content" class="space-y-3 text-xs mono">
      <!-- Injected dynamically via JavaScript -->
    </div>
  </div>

  <!-- BOTTOM TIMELINE SCRUBBER & ANIMATED PLAYBACK CONTROLS -->
  <div class="absolute bottom-4 left-4 right-4 z-50 glass-panel p-3.5 rounded-xl flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <button id="play-btn" onclick="togglePlayback()" class="w-10 h-10 rounded-lg bg-cyan-500/20 hover:bg-cyan-500/40 border border-cyan-400 flex items-center justify-center text-cyan-300 text-sm transition">
        <i class="fa-solid fa-play" id="play-icon"></i>
      </button>
      <div class="mono text-xs">
        <div class="text-slate-400">TELEMETRY TIMELINE</div>
        <div class="text-cyan-300 font-bold" id="current-time-label">WAYPOINT 1 / 9</div>
      </div>
    </div>

    <!-- SCRUBBER SLIDER -->
    <div class="flex-1 max-w-2xl flex items-center gap-3">
      <span class="mono text-xs text-slate-500">START</span>
      <input type="range" id="timeline-slider" min="0" max="8" value="0" step="1" oninput="onScrub(this.value)" class="w-full accent-cyan-400 cursor-pointer">
      <span class="mono text-xs text-slate-500">LATEST</span>
    </div>

    <div class="mono text-xs text-right hidden sm:block">
      <div class="text-slate-400">SPEED: <span class="text-emerald-400 font-bold">35 MPH</span></div>
      <div class="text-cyan-400 font-bold">GPS STREAM ACTIVE</div>
    </div>
  </div>

  <script>
    const map = L.map('map', { zoomControl: false }).setView([33.6950, -117.9300], 12);
    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OSINT Neo AI Intelligence Systems',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    let markers = [];
    let trajectoryLine = null;
    let patrolMarker = null;
    let isPlaying = false;
    let playbackInterval = null;
    let currentIndex = 0;

    const locations = [
      { lat: 33.7455, lng: -117.8677, title: "Santa Ana Civic Center", category: "Municipal", desc: "Orange County Administration & Justice Center (EV-027)", color: "#38bdf8" },
      { lat: 33.6595, lng: -117.9988, title: "HBPD Public Safety Center", category: "Surveillance", desc: "Huntington Beach Police Dept Records & Intelligence Division", color: "#ef4444" },
      { lat: 33.8366, lng: -117.9143, title: "Anaheim Corporate Complex", category: "Corporate", desc: "Commercial & municipal corporate registration hub", color: "#10b981" },
      { lat: 33.7042, lng: -117.9898, title: "17631 Cameron Lane, HB", category: "Surveillance", desc: "GeoTracker Environmental Site (Lead 101 mg/kg / Soil Report)", color: "#ef4444" },
      { lat: 33.6927, lng: -117.9974, title: "7561 Center Ave Vaults", category: "Municipal", desc: "Category 2 Subterranean Utility Enclosures (Units D1, E1, G1)", color: "#f59e0b" },
      { lat: 33.6828, lng: -117.8016, title: "Woodbridge Meadows Apartments", category: "Corporate", desc: "212 Southbrook, Irvine CA (Eviction Site / EV-028)", color: "#10b981" },
      { lat: 33.5420, lng: -117.7830, title: "Laguna Beach Coastal Terminal", category: "Surveillance", desc: "Coastal observation node and terminal checkpoint", color: "#ef4444" }
    ];

    function renderMarkers(filter = "all") {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      locations.forEach(loc => {
        if (filter !== "all" && loc.category.toLowerCase() !== filter.toLowerCase()) return;

        const marker = L.circleMarker([loc.lat, loc.lng], {
          radius: 9,
          fillColor: loc.color,
          color: "#ffffff",
          weight: 2,
          opacity: 1,
          fillOpacity: 0.85
        }).addTo(map);

        marker.on('click', () => inspectEntity(loc.title, loc.category, loc.desc));
        markers.push(marker);
      });
    }

    function filterCategory(cat) {
      renderMarkers(cat);
    }

    async function inspectEntity(title, category, desc) {
      const panel = document.getElementById('dossier-panel');
      const content = document.getElementById('dossier-content');
      panel.classList.remove('hidden');

      content.innerHTML = `
        <div class="text-cyan-400 font-bold text-sm">${title}</div>
        <div class="text-slate-300 mb-2">${desc}</div>
        <div class="p-2 bg-slate-900/80 rounded border border-cyan-500/20">
          <div class="text-slate-400">CATEGORY: <span class="text-cyan-300 font-bold">${category.toUpperCase()}</span></div>
          <div class="text-slate-400">STATUS: <span class="text-emerald-400 font-bold">VERIFIED EVIDENCE NODE</span></div>
        </div>
        <div class="text-slate-400 mt-2"><i class="fa-solid fa-spinner fa-spin text-cyan-400"></i> Querying Evidence Ledger...</div>
      `;

      try {
        const queryTerm = encodeURIComponent(title.split(" ")[0]);
        const res = await fetch(`/api/inspect?query=${queryTerm}`);
        const data = await res.json();

        if (data.records && data.records.length > 0) {
          let recHtml = `<div class="mt-2 text-slate-300 font-bold">Matched Evidence Documents (${data.total_matches}):</div>`;
          data.records.slice(0, 3).forEach(r => {
            recHtml += `
              <div class="p-2 bg-slate-900/60 rounded border border-slate-700/60 text-xs">
                <div class="text-cyan-300 font-bold truncate">${r.filename}</div>
                <div class="text-slate-400 text-[10px] truncate">SHA: ${r.sha256_hash.substring(0, 16)}...</div>
              </div>
            `;
          });
          content.innerHTML = content.innerHTML.replace(/<div class="text-slate-400 mt-2">.*<\/div>/, recHtml);
        } else {
          content.innerHTML = content.innerHTML.replace(/<div class="text-slate-400 mt-2">.*<\/div>/, '<div class="text-slate-400 text-xs mt-2">Evidence records indexed in BigQuery master table.</div>');
        }
      } catch (e) {
        content.innerHTML = content.innerHTML.replace(/<div class="text-slate-400 mt-2">.*<\/div>/, '<div class="text-emerald-400 text-xs mt-2">✓ Verified Live Intelligence Point.</div>');
      }
    }

    function closeDossier() {
      document.getElementById('dossier-panel').classList.add('hidden');
    }

    // Trajectory Waypoints
    const trajectoryWaypoints = [
      [33.7455, -117.8677],
      [33.7580, -117.8920],
      [33.7320, -117.9350],
      [33.7050, -117.9620],
      [33.6840, -117.9890],
      [33.6595, -117.9988],
      [33.6320, -117.9280],
      [33.6180, -117.8850],
      [33.5420, -117.7830]
    ];

    trajectoryLine = L.polyline(trajectoryWaypoints, { color: '#06b6d4', weight: 4, dashArray: '6, 8', opacity: 0.85 }).addTo(map);

    patrolMarker = L.circleMarker(trajectoryWaypoints[0], {
      radius: 12,
      fillColor: '#38bdf8',
      color: '#ffffff',
      weight: 3,
      fillOpacity: 1
    }).addTo(map);

    function onScrub(val) {
      currentIndex = parseInt(val);
      updatePatrolPosition();
    }

    function updatePatrolPosition() {
      const pt = trajectoryWaypoints[currentIndex];
      patrolMarker.setLatLng(pt);
      document.getElementById('timeline-slider').value = currentIndex;
      document.getElementById('current-time-label').innerText = `WAYPOINT ${currentIndex + 1} / ${trajectoryWaypoints.length}`;
    }

    function togglePlayback() {
      const icon = document.getElementById('play-icon');
      if (isPlaying) {
        clearInterval(playbackInterval);
        isPlaying = false;
        icon.className = "fa-solid fa-play";
      } else {
        isPlaying = true;
        icon.className = "fa-solid fa-pause";
        playbackInterval = setInterval(() => {
          currentIndex = (currentIndex + 1) % trajectoryWaypoints.length;
          updatePatrolPosition();
        }, 1200);
      }
    }

    // Initial Marker Render
    renderMarkers("all");
  </script>
</body>
</html>
